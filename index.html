<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>合唱パート練習アプリ</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --ink: #2b2b2b;
    --sub: #6b6b6b;
    --line: #e4ded0;
    --accent: #9b5de5;
    --soprano: #e8637a;
    --alto: #2f9e8f;
    --tenor: #3a6ea5;
    --piano: #7d7d7d;
    --all: #b8862e;
    --shadow: 0 2px 10px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17151b;
      --panel: #221f28;
      --ink: #f1eef7;
      --sub: #a79fc9;
      --line: #35303f;
      --accent: #b892f0;
      --soprano: #f28aa0;
      --alto: #5ccbb9;
      --tenor: #7ea9dd;
      --piano: #a8a8a8;
      --all: #e0af5b;
      --shadow: 0 2px 12px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }
  body {
    padding-bottom: 130px;
  }
  header {
    padding: 20px 16px 8px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 14px;
    font-size: 1.3rem;
    letter-spacing: 0.02em;
  }
  .song-tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .song-tab {
    padding: 10px 22px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .song-tab.active {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
  }
  .group {
    margin-bottom: 22px;
  }
  .group h2 {
    font-size: 0.9rem;
    color: var(--sub);
    font-weight: 600;
    margin: 0 0 10px;
    padding-left: 4px;
  }
  .track-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .track-btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding: 14px 14px 12px;
    border-radius: 14px;
    border: none;
    background: var(--panel);
    box-shadow: var(--shadow);
    cursor: pointer;
    text-align: left;
    border-left: 6px solid var(--part-color, var(--accent));
    font-family: inherit;
    color: var(--ink);
    min-height: 64px;
  }
  .track-btn:active {
    transform: scale(0.98);
  }
  .track-btn.playing {
    background: var(--part-color, var(--accent));
    color: #fff;
  }
  .track-btn .label {
    font-size: 1rem;
    font-weight: 700;
  }
  .track-btn .icon {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 1rem;
    opacity: 0.85;
  }
  .player {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
  }
  .player-inner {
    max-width: 720px;
    margin: 0 auto;
  }
  .now-playing {
    font-size: 0.85rem;
    color: var(--sub);
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .now-playing strong {
    color: var(--ink);
  }
  .seek-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .seek-row input[type=range] {
    flex: 1;
    accent-color: var(--accent);
  }
  .time {
    font-size: 0.75rem;
    color: var(--sub);
    min-width: 38px;
    text-align: center;
  }
  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .transport {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn {
    border: none;
    background: var(--line);
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
  }
  .btn.play {
    background: var(--accent);
    color: #fff;
    font-size: 1.1rem;
    padding: 8px 18px;
  }
  .side-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.8rem;
    color: var(--sub);
  }
  select {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 6px;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
  }
  .loop-btn.on {
    background: var(--accent);
    color: #fff;
  }
  input[type=range].volume {
    width: 70px;
    accent-color: var(--accent);
  }
  .empty-hint {
    text-align: center;
    color: var(--sub);
    font-size: 0.85rem;
    margin-top: 40px;
  }
</style>
</head>
<body>

<header>
  <h1>合唱パート練習</h1>
  <div class="song-tabs" id="songTabs"></div>
</header>

<main id="main"></main>

<div class="player">
  <div class="player-inner">
    <div class="now-playing" id="nowPlaying">曲名をタップして再生してください</div>
    <div class="seek-row">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <span class="time" id="durTime">0:00</span>
    </div>
    <div class="controls-row">
      <div class="transport">
        <button class="btn" id="back5">-5s</button>
        <button class="btn play" id="playPause">▶ 再生</button>
        <button class="btn" id="fwd5">+5s</button>
      </div>
      <div class="side-controls">
        <button class="btn loop-btn" id="loopBtn" title="くり返し再生">🔁</button>
        <label>速度
          <select id="speed">
            <option value="0.7">0.7x</option>
            <option value="0.8">0.8x</option>
            <option value="0.9">0.9x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.1">1.1x</option>
          </select>
        </label>
        <span>🔊</span>
        <input type="range" class="volume" id="volume" min="0" max="1" value="1" step="0.01">
      </div>
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
const SONGS = [
  {
    id: 'kouka',
    title: '校歌',
    folder: '校歌',
    groups: [
      { label: '基本音源', tracks: [
        { file: '00　校歌_全パート+ピアノ.mp3', label: '全パート + ピアノ', part: 'all' },
        { file: '04　校歌_ピアノ伴奏のみ.mp3', label: 'ピアノ伴奏のみ', part: 'piano' },
      ]},
      { label: '各パート + ピアノ', tracks: [
        { file: '01　校歌_ソプラノ+ピアノ.mp3', label: 'ソプラノ + ピアノ', part: 'soprano' },
        { file: '02　校歌_アルト+ピアノ.mp3', label: 'アルト + ピアノ', part: 'alto' },
        { file: '03　校歌_男声+ピアノ.mp3', label: '男声 + ピアノ', part: 'tenor' },
      ]},
      { label: 'パート練習用（自分のパートが聞き取りやすいバランス）', tracks: [
        { file: '05　校歌_ソプラノ練習用(アルト+男声+ピアノ).mp3', label: 'ソプラノ練習用', part: 'soprano' },
        { file: '06　校歌_アルト練習用(ソプラノ+男声+ピアノ).mp3', label: 'アルト練習用', part: 'alto' },
        { file: '07　校歌_男声練習用(ソプラノ+アルト+ピアノ).mp3', label: '男声練習用', part: 'tenor' },
      ]},
    ]
  },
  {
    id: 'chikyu',
    title: '地球へ',
    folder: '地球へ',
    groups: [
      { label: '基本音源', tracks: [
        { file: '000　地球へ_メイン+ピアノ.mp3', label: 'メイン + ピアノ', part: 'all' },
        { file: '00　地球へ_全パート+ピアノ.mp3', label: '全パート + ピアノ', part: 'all' },
        { file: '04　地球へ_ピアノ伴奏のみ.mp3', label: 'ピアノ伴奏のみ', part: 'piano' },
      ]},
      { label: '各パート + ピアノ', tracks: [
        { file: '01　地球へ_ソプラノ+ピアノ.mp3', label: 'ソプラノ + ピアノ', part: 'soprano' },
        { file: '02　地球へ_アルト+ピアノ.mp3', label: 'アルト + ピアノ', part: 'alto' },
        { file: '03　地球へ_男声+ピアノ.mp3', label: '男声 + ピアノ', part: 'tenor' },
      ]},
      { label: 'パート練習用（自分のパートが聞き取りやすいバランス）', tracks: [
        { file: '05　地球へ_ソプラノ練習用(メイン+アルト+男声+ピアノ).mp3', label: 'ソプラノ練習用', part: 'soprano' },
        { file: '06　地球へ_アルト練習用(メイン+ソプラノ+男声+ピアノ).mp3', label: 'アルト練習用', part: 'alto' },
        { file: '07　地球へ_男声練習用(メイン+ソプラノ+アルト+ピアノ).mp3', label: '男声練習用', part: 'tenor' },
      ]},
    ]
  },
];

const PART_LABEL = { soprano: 'ソプラノ', alto: 'アルト', tenor: '男声', piano: 'ピアノ', all: '全体' };

const audio = document.getElementById('audio');
const songTabs = document.getElementById('songTabs');
const mainEl = document.getElementById('main');
const nowPlaying = document.getElementById('nowPlaying');
const playPauseBtn = document.getElementById('playPause');
const seek = document.getElementById('seek');
const curTimeEl = document.getElementById('curTime');
const durTimeEl = document.getElementById('durTime');
const speedSel = document.getElementById('speed');
const volumeEl = document.getElementById('volume');
const loopBtn = document.getElementById('loopBtn');

let currentSongId = localStorage.getItem('gassyo_song') || SONGS[0].id;
let currentTrackBtn = null;
let isSeeking = false;

function fmtTime(sec) {
  if (!isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function renderTabs() {
  songTabs.innerHTML = '';
  SONGS.forEach(song => {
    const b = document.createElement('button');
    b.className = 'song-tab' + (song.id === currentSongId ? ' active' : '');
    b.textContent = song.title;
    b.onclick = () => {
      currentSongId = song.id;
      localStorage.setItem('gassyo_song', song.id);
      renderTabs();
      renderTracks();
    };
    songTabs.appendChild(b);
  });
}

function renderTracks() {
  const song = SONGS.find(s => s.id === currentSongId);
  mainEl.innerHTML = '';
  currentTrackBtn = null;
  song.groups.forEach(group => {
    const groupEl = document.createElement('div');
    groupEl.className = 'group';
    const h2 = document.createElement('h2');
    h2.textContent = group.label;
    groupEl.appendChild(h2);

    const grid = document.createElement('div');
    grid.className = 'track-grid';

    group.tracks.forEach(track => {
      const btn = document.createElement('button');
      btn.className = 'track-btn';
      btn.style.setProperty('--part-color', `var(--${track.part})`);
      const path = song.folder + '/' + track.file;
      btn.dataset.path = path;
      btn.innerHTML = `<span class="icon">▶</span><span class="label">${track.label}</span>`;
      btn.onclick = () => playTrack(song, track, btn);
      grid.appendChild(btn);
    });

    groupEl.appendChild(grid);
    mainEl.appendChild(groupEl);
  });
}

function playTrack(song, track, btn) {
  const path = song.folder + '/' + track.file;
  if (currentTrackBtn === btn && !audio.paused) {
    audio.pause();
    return;
  }
  document.querySelectorAll('.track-btn.playing').forEach(el => {
    el.classList.remove('playing');
    el.querySelector('.icon').textContent = '▶';
  });
  audio.src = path;
  audio.currentTime = 0;
  audio.play().catch(() => {});
  currentTrackBtn = btn;
  btn.classList.add('playing');
  btn.querySelector('.icon').textContent = '⏸';
  nowPlaying.innerHTML = `再生中：<strong>${song.title} - ${track.label}</strong>`;
}

playPauseBtn.onclick = () => {
  if (!audio.src) return;
  if (audio.paused) audio.play().catch(() => {});
  else audio.pause();
};

audio.addEventListener('play', () => {
  playPauseBtn.textContent = '⏸ 一時停止';
  if (currentTrackBtn) {
    currentTrackBtn.classList.add('playing');
    currentTrackBtn.querySelector('.icon').textContent = '⏸';
  }
});
audio.addEventListener('pause', () => {
  playPauseBtn.textContent = '▶ 再生';
  if (currentTrackBtn) {
    currentTrackBtn.querySelector('.icon').textContent = '▶';
  }
});
audio.addEventListener('loadedmetadata', () => {
  seek.max = audio.duration;
  durTimeEl.textContent = fmtTime(audio.duration);
});
audio.addEventListener('timeupdate', () => {
  if (isSeeking) return;
  seek.value = audio.currentTime;
  curTimeEl.textContent = fmtTime(audio.currentTime);
});
audio.addEventListener('ended', () => {
  if (currentTrackBtn) {
    currentTrackBtn.classList.remove('playing');
    currentTrackBtn.querySelector('.icon').textContent = '▶';
  }
});

seek.addEventListener('input', () => {
  isSeeking = true;
  curTimeEl.textContent = fmtTime(seek.value);
});
seek.addEventListener('change', () => {
  audio.currentTime = seek.value;
  isSeeking = false;
});

document.getElementById('back5').onclick = () => {
  audio.currentTime = Math.max(0, audio.currentTime - 5);
};
document.getElementById('fwd5').onclick = () => {
  audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
};

speedSel.onchange = () => {
  audio.playbackRate = parseFloat(speedSel.value);
  localStorage.setItem('gassyo_speed', speedSel.value);
};

volumeEl.oninput = () => {
  audio.volume = parseFloat(volumeEl.value);
  localStorage.setItem('gassyo_volume', volumeEl.value);
};

loopBtn.onclick = () => {
  audio.loop = !audio.loop;
  loopBtn.classList.toggle('on', audio.loop);
};

// restore saved preferences
const savedSpeed = localStorage.getItem('gassyo_speed');
if (savedSpeed) {
  speedSel.value = savedSpeed;
  audio.playbackRate = parseFloat(savedSpeed);
}
const savedVolume = localStorage.getItem('gassyo_volume');
if (savedVolume !== null) {
  volumeEl.value = savedVolume;
  audio.volume = parseFloat(savedVolume);
}

renderTabs();
renderTracks();
</script>

</body>
</html>

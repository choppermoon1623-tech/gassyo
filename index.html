<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>合唱パート練習アプリ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#7c2d40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="パート練習">
<style>
  :root {
    --bg: #e9e4d8;
    --panel: #fffdf8;
    --ink: #2a2521;
    --sub: #7d7263;
    --line: #d8cfbd;
    --accent: #7c2d40;
    --soprano: #a13a52;
    --alto: #2f6f5e;
    --tenor: #2c4a63;
    --piano: #6b675e;
    --all: #8a6d1f;
    --shadow: 0 1px 3px rgba(30,25,15,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14130f;
      --panel: #1d1b17;
      --ink: #eae4d7;
      --sub: #a89c85;
      --line: #332f27;
      --accent: #caa46a;
      --soprano: #d5879a;
      --alto: #6fae9c;
      --tenor: #85a4c4;
      --piano: #a39c8c;
      --all: #d4b46a;
      --shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }
  body {
    padding-bottom: 130px;
  }
  header {
    padding: 28px 16px 10px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0 0 20px;
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    color: var(--ink);
  }
  .song-tabs {
    display: flex;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
  }
  .song-tab {
    padding: 4px 2px 10px;
    border: none;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--sub);
    font-size: 0.98rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .song-tab.active {
    border-bottom-color: var(--accent);
    color: var(--ink);
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px;
  }
  .group {
    margin-bottom: 26px;
  }
  .group h2 {
    font-size: 0.82rem;
    color: var(--sub);
    font-weight: 600;
    letter-spacing: 0.03em;
    margin: 0 0 4px;
    padding-left: 2px;
  }
  .group .group-note {
    font-size: 0.76rem;
    color: var(--sub);
    opacity: 0.85;
    margin: 0 0 10px;
    padding-left: 2px;
  }
  .track-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .track-btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
    padding: 13px 34px 11px 15px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: var(--shadow);
    cursor: pointer;
    text-align: left;
    border-left: 3px solid var(--part-color, var(--accent));
    font-family: inherit;
    color: var(--ink);
    min-height: 60px;
  }
  .track-btn:active {
    transform: scale(0.98);
  }
  .track-btn.playing {
    background: var(--part-color, var(--accent));
    border-color: var(--part-color, var(--accent));
    color: #fff;
  }
  .track-btn.playing .sub {
    color: rgba(255,255,255,0.8);
  }
  .track-btn .label {
    font-size: 0.98rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .track-btn .sub {
    font-size: 0.74rem;
    color: var(--sub);
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-btn .icon {
    position: absolute;
    top: 14px;
    right: 12px;
    font-size: 0.9rem;
    opacity: 0.7;
  }
  .player {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
  }
  .player-inner {
    max-width: 720px;
    margin: 0 auto;
  }
  .now-playing {
    font-size: 0.85rem;
    color: var(--sub);
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .now-playing strong {
    color: var(--ink);
  }
  .seek-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .seek-row input[type=range] {
    flex: 1;
    accent-color: var(--accent);
  }
  .time {
    font-size: 0.75rem;
    color: var(--sub);
    min-width: 38px;
    text-align: center;
  }
  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .transport {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 7px;
    padding: 8px 12px;
    font-size: 0.92rem;
    cursor: pointer;
    font-family: inherit;
  }
  .btn.play {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-size: 1.02rem;
    padding: 8px 20px;
  }
  .side-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.8rem;
    color: var(--sub);
  }
  select {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 6px;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
  }
  .loop-btn.on {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  input[type=range].volume {
    width: 70px;
    accent-color: var(--accent);
  }
  .ab-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
    font-size: 0.85rem;
  }
  .ab-title {
    color: var(--sub);
    font-size: 0.78rem;
    margin-right: 2px;
  }
  .ab-btn.set {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .ab-range {
    font-size: 0.78rem;
    color: var(--sub);
    min-width: 78px;
  }
  .ab-clear {
    margin-left: auto;
    opacity: 0.7;
  }
  .empty-hint {
    text-align: center;
    color: var(--sub);
    font-size: 0.85rem;
    margin-top: 40px;
  }
  .checklist {
    margin-top: 8px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .checklist-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .checklist-head h2 {
    font-size: 0.82rem;
    color: var(--sub);
    font-weight: 600;
    letter-spacing: 0.03em;
    margin: 0;
  }
  .checklist-reset {
    font-size: 0.72rem;
    padding: 4px 10px;
    opacity: 0.75;
  }
  .check-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .check-row:last-child {
    border-bottom: none;
  }
  .check-part {
    width: 64px;
    flex-shrink: 0;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .chip {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--sub);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.82rem;
    cursor: pointer;
    font-family: inherit;
  }
  .chip.on {
    background: var(--part-color, var(--accent));
    border-color: var(--part-color, var(--accent));
    color: #fff;
    font-weight: 600;
  }
</style>
</head>
<body>

<header>
  <h1>合唱パート練習</h1>
  <div class="song-tabs" id="songTabs"></div>
</header>

<main id="main"></main>

<div class="player">
  <div class="player-inner">
    <div class="now-playing" id="nowPlaying">曲名をタップして再生してください</div>
    <div class="seek-row">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <span class="time" id="durTime">0:00</span>
    </div>
    <div class="controls-row">
      <div class="transport">
        <button class="btn" id="back5">-5s</button>
        <button class="btn play" id="playPause">▶ 再生</button>
        <button class="btn" id="fwd5">+5s</button>
      </div>
      <div class="side-controls">
        <button class="btn loop-btn" id="loopBtn" title="曲全体をくり返し再生">🔁 全体</button>
        <label>速度
          <select id="speed">
            <option value="0.7">0.7x</option>
            <option value="0.8">0.8x</option>
            <option value="0.9">0.9x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.1">1.1x</option>
          </select>
        </label>
        <span>🔊</span>
        <input type="range" class="volume" id="volume" min="0" max="1" value="1" step="0.01">
      </div>
    </div>
    <div class="ab-row">
      <span class="ab-title">区間リピート</span>
      <button class="btn ab-btn" id="setA" title="現在位置をA点に設定">A点</button>
      <button class="btn ab-btn" id="setB" title="現在位置をB点に設定">B点</button>
      <span class="ab-range" id="abRange">未設定</span>
      <button class="btn loop-btn" id="abToggle" disabled>▶ 区間ループ</button>
      <button class="btn ab-clear" id="abClear" title="区間をクリア">✕</button>
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
const SONGS = [
  {
    id: 'kouka',
    title: '校歌',
    folder: '校歌',
    groups: [
      { label: '基本音源', tracks: [
        { file: '00　校歌_全パート+ピアノ.mp3', label: '全パート + ピアノ', part: 'all' },
        { file: '04　校歌_ピアノ伴奏のみ.mp3', label: 'ピアノ伴奏のみ', part: 'piano' },
      ]},
      { label: '各パート + ピアノ', tracks: [
        { file: '01　校歌_ソプラノ+ピアノ.mp3', label: 'ソプラノ + ピアノ', part: 'soprano' },
        { file: '02　校歌_アルト+ピアノ.mp3', label: 'アルト + ピアノ', part: 'alto' },
        { file: '03　校歌_男声+ピアノ.mp3', label: '男声 + ピアノ', part: 'tenor' },
      ]},
      { label: 'マイナスワン音源', note: '自分のパートを抜いた伴奏。自分で歌いながら合わせる練習に', tracks: [
        { file: '05　校歌_ソプラノ練習用(アルト+男声+ピアノ).mp3', label: 'ソプラノ抜き', sub: 'アルト + 男声 + ピアノ', part: 'soprano' },
        { file: '06　校歌_アルト練習用(ソプラノ+男声+ピアノ).mp3', label: 'アルト抜き', sub: 'ソプラノ + 男声 + ピアノ', part: 'alto' },
        { file: '07　校歌_男声練習用(ソプラノ+アルト+ピアノ).mp3', label: '男声抜き', sub: 'ソプラノ + アルト + ピアノ', part: 'tenor' },
      ]},
    ]
  },
  {
    id: 'chikyu',
    title: '地球へ',
    folder: '地球へ',
    groups: [
      { label: '基本音源', tracks: [
        { file: '000　地球へ_メイン+ピアノ.mp3', label: 'メイン + ピアノ', part: 'all' },
        { file: '00　地球へ_全パート+ピアノ.mp3', label: '全パート + ピアノ', part: 'all' },
        { file: '04　地球へ_ピアノ伴奏のみ.mp3', label: 'ピアノ伴奏のみ', part: 'piano' },
      ]},
      { label: '各パート + ピアノ', tracks: [
        { file: '01　地球へ_ソプラノ+ピアノ.mp3', label: 'ソプラノ + ピアノ', part: 'soprano' },
        { file: '02　地球へ_アルト+ピアノ.mp3', label: 'アルト + ピアノ', part: 'alto' },
        { file: '03　地球へ_男声+ピアノ.mp3', label: '男声 + ピアノ', part: 'tenor' },
      ]},
      { label: 'マイナスワン音源', note: '自分のパートを抜いた伴奏。自分で歌いながら合わせる練習に', tracks: [
        { file: '05　地球へ_ソプラノ練習用(メイン+アルト+男声+ピアノ).mp3', label: 'ソプラノ抜き', sub: 'メイン + アルト + 男声 + ピアノ', part: 'soprano' },
        { file: '06　地球へ_アルト練習用(メイン+ソプラノ+男声+ピアノ).mp3', label: 'アルト抜き', sub: 'メイン + ソプラノ + 男声 + ピアノ', part: 'alto' },
        { file: '07　地球へ_男声練習用(メイン+ソプラノ+アルト+ピアノ).mp3', label: '男声抜き', sub: 'メイン + ソプラノ + アルト + ピアノ', part: 'tenor' },
      ]},
    ]
  },
];

const PART_LABEL = { soprano: 'ソプラノ', alto: 'アルト', tenor: '男声', piano: 'ピアノ', all: '全体' };
const CHECK_PARTS = ['soprano', 'alto', 'tenor'];

const audio = document.getElementById('audio');
const songTabs = document.getElementById('songTabs');
const mainEl = document.getElementById('main');
const nowPlaying = document.getElementById('nowPlaying');
const playPauseBtn = document.getElementById('playPause');
const seek = document.getElementById('seek');
const curTimeEl = document.getElementById('curTime');
const durTimeEl = document.getElementById('durTime');
const speedSel = document.getElementById('speed');
const volumeEl = document.getElementById('volume');
const loopBtn = document.getElementById('loopBtn');
const setABtn = document.getElementById('setA');
const setBBtn = document.getElementById('setB');
const abRangeEl = document.getElementById('abRange');
const abToggleBtn = document.getElementById('abToggle');
const abClearBtn = document.getElementById('abClear');

let currentSongId = localStorage.getItem('gassyo_song') || SONGS[0].id;
let currentTrackBtn = null;
let isSeeking = false;
let abA = null;
let abB = null;
let abEnabled = false;

function fmtTime(sec) {
  if (!isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function renderTabs() {
  songTabs.innerHTML = '';
  SONGS.forEach(song => {
    const b = document.createElement('button');
    b.className = 'song-tab' + (song.id === currentSongId ? ' active' : '');
    b.textContent = song.title;
    b.onclick = () => {
      currentSongId = song.id;
      localStorage.setItem('gassyo_song', song.id);
      renderTabs();
      renderTracks();
    };
    songTabs.appendChild(b);
  });
}

function renderTracks() {
  const song = SONGS.find(s => s.id === currentSongId);
  mainEl.innerHTML = '';
  currentTrackBtn = null;
  song.groups.forEach(group => {
    const groupEl = document.createElement('div');
    groupEl.className = 'group';
    const h2 = document.createElement('h2');
    h2.textContent = group.label;
    groupEl.appendChild(h2);

    if (group.note) {
      const noteEl = document.createElement('p');
      noteEl.className = 'group-note';
      noteEl.textContent = group.note;
      groupEl.appendChild(noteEl);
    }

    const grid = document.createElement('div');
    grid.className = 'track-grid';

    group.tracks.forEach(track => {
      const btn = document.createElement('button');
      btn.className = 'track-btn';
      btn.style.setProperty('--part-color', `var(--${track.part})`);
      const path = song.folder + '/' + track.file;
      btn.dataset.path = path;
      const subHtml = track.sub ? `<span class="sub" title="${track.sub}">${track.sub}</span>` : '';
      btn.innerHTML = `<span class="icon">▶</span><span class="label">${track.label}</span>${subHtml}`;
      btn.onclick = () => playTrack(song, track, btn);
      grid.appendChild(btn);
    });

    groupEl.appendChild(grid);
    mainEl.appendChild(groupEl);
  });

  renderChecklist(song);
  resetAB();
}

function loadChecklist(songId) {
  try {
    const raw = localStorage.getItem('gassyo_check_' + songId);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const fresh = {};
  CHECK_PARTS.forEach(p => fresh[p] = { listened: false, sung: false });
  return fresh;
}

function saveChecklist(songId, data) {
  localStorage.setItem('gassyo_check_' + songId, JSON.stringify(data));
}

function renderChecklist(song) {
  const data = loadChecklist(song.id);

  const wrap = document.createElement('div');
  wrap.className = 'checklist';

  const head = document.createElement('div');
  head.className = 'checklist-head';
  head.innerHTML = '<h2>練習チェック（自己申告・この端末のみ保存）</h2>';
  const resetBtn = document.createElement('button');
  resetBtn.className = 'btn checklist-reset';
  resetBtn.textContent = 'リセット';
  resetBtn.onclick = () => {
    if (!confirm(song.title + 'のチェックをすべてリセットしますか？')) return;
    CHECK_PARTS.forEach(p => { data[p] = { listened: false, sung: false }; });
    saveChecklist(song.id, data);
    renderTracks();
  };
  head.appendChild(resetBtn);
  wrap.appendChild(head);

  CHECK_PARTS.forEach(part => {
    const row = document.createElement('div');
    row.className = 'check-row';

    const label = document.createElement('span');
    label.className = 'check-part';
    label.style.color = `var(--${part})`;
    label.textContent = PART_LABEL[part];
    row.appendChild(label);

    [['listened', '聞いた'], ['sung', '歌えた']].forEach(([kind, text]) => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (data[part][kind] ? ' on' : '');
      chip.style.setProperty('--part-color', `var(--${part})`);
      chip.textContent = (data[part][kind] ? '✓ ' : '') + text;
      chip.onclick = () => {
        data[part][kind] = !data[part][kind];
        saveChecklist(song.id, data);
        chip.classList.toggle('on', data[part][kind]);
        chip.textContent = (data[part][kind] ? '✓ ' : '') + text;
      };
      row.appendChild(chip);
    });

    wrap.appendChild(row);
  });

  mainEl.appendChild(wrap);
}

function resetAB() {
  abA = null;
  abB = null;
  abEnabled = false;
  updateABUI();
}

function updateABUI() {
  abRangeEl.textContent = (abA !== null && abB !== null)
    ? `${fmtTime(abA)} - ${fmtTime(abB)}`
    : (abA !== null ? `A:${fmtTime(abA)} …` : '未設定');
  abToggleBtn.disabled = !(abA !== null && abB !== null && abA < abB);
  abToggleBtn.textContent = abEnabled ? '⏸ 区間ループ中' : '▶ 区間ループ';
  abToggleBtn.classList.toggle('on', abEnabled);
  setABtn.classList.toggle('set', abA !== null);
  setBBtn.classList.toggle('set', abB !== null);
}

function playTrack(song, track, btn) {
  const path = song.folder + '/' + track.file;
  if (currentTrackBtn === btn && !audio.paused) {
    audio.pause();
    return;
  }
  document.querySelectorAll('.track-btn.playing').forEach(el => {
    el.classList.remove('playing');
    el.querySelector('.icon').textContent = '▶';
  });
  resetAB();
  audio.loop = false;
  loopBtn.classList.remove('on');
  audio.src = path;
  audio.currentTime = 0;
  audio.play().catch(() => {});
  currentTrackBtn = btn;
  btn.classList.add('playing');
  btn.querySelector('.icon').textContent = '⏸';
  nowPlaying.innerHTML = `再生中：<strong>${song.title} - ${track.label}</strong>`;
}

playPauseBtn.onclick = () => {
  if (!audio.src) return;
  if (audio.paused) audio.play().catch(() => {});
  else audio.pause();
};

audio.addEventListener('play', () => {
  playPauseBtn.textContent = '⏸ 一時停止';
  if (currentTrackBtn) {
    currentTrackBtn.classList.add('playing');
    currentTrackBtn.querySelector('.icon').textContent = '⏸';
  }
});
audio.addEventListener('pause', () => {
  playPauseBtn.textContent = '▶ 再生';
  if (currentTrackBtn) {
    currentTrackBtn.querySelector('.icon').textContent = '▶';
  }
});
audio.addEventListener('loadedmetadata', () => {
  seek.max = audio.duration;
  durTimeEl.textContent = fmtTime(audio.duration);
});
audio.addEventListener('timeupdate', () => {
  if (abEnabled && abB !== null && audio.currentTime >= abB) {
    audio.currentTime = abA;
  }
  if (isSeeking) return;
  seek.value = audio.currentTime;
  curTimeEl.textContent = fmtTime(audio.currentTime);
});
audio.addEventListener('ended', () => {
  if (currentTrackBtn) {
    currentTrackBtn.classList.remove('playing');
    currentTrackBtn.querySelector('.icon').textContent = '▶';
  }
});

seek.addEventListener('input', () => {
  isSeeking = true;
  curTimeEl.textContent = fmtTime(seek.value);
});
seek.addEventListener('change', () => {
  audio.currentTime = seek.value;
  isSeeking = false;
});

document.getElementById('back5').onclick = () => {
  audio.currentTime = Math.max(0, audio.currentTime - 5);
};
document.getElementById('fwd5').onclick = () => {
  audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
};

speedSel.onchange = () => {
  audio.playbackRate = parseFloat(speedSel.value);
  localStorage.setItem('gassyo_speed', speedSel.value);
};

volumeEl.oninput = () => {
  audio.volume = parseFloat(volumeEl.value);
  localStorage.setItem('gassyo_volume', volumeEl.value);
};

loopBtn.onclick = () => {
  audio.loop = !audio.loop;
  loopBtn.classList.toggle('on', audio.loop);
  if (audio.loop && abEnabled) {
    abEnabled = false;
    updateABUI();
  }
};

setABtn.onclick = () => {
  abA = audio.currentTime;
  if (abB !== null && abB <= abA) abB = null;
  updateABUI();
};
setBBtn.onclick = () => {
  abB = audio.currentTime;
  if (abA !== null && abA >= abB) abA = null;
  updateABUI();
};
abToggleBtn.onclick = () => {
  if (abToggleBtn.disabled) return;
  abEnabled = !abEnabled;
  if (abEnabled) {
    audio.loop = false;
    loopBtn.classList.remove('on');
    if (audio.currentTime < abA || audio.currentTime > abB) {
      audio.currentTime = abA;
    }
  }
  updateABUI();
};
abClearBtn.onclick = () => {
  resetAB();
};

// restore saved preferences
const savedSpeed = localStorage.getItem('gassyo_speed');
if (savedSpeed) {
  speedSel.value = savedSpeed;
  audio.playbackRate = parseFloat(savedSpeed);
}
const savedVolume = localStorage.getItem('gassyo_volume');
if (savedVolume !== null) {
  volumeEl.value = savedVolume;
  audio.volume = parseFloat(savedVolume);
}

renderTabs();
renderTracks();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
